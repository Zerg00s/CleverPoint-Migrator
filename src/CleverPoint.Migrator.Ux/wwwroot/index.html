<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleverPoint Migrator</title>
    <base href="/" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link href="_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css" rel="stylesheet" />
    <link href="app.css" rel="stylesheet" />
    <!-- Scoped-CSS bundle: REQUIRED for Blazor-rendered Fluent components (DataGrid, Dialog, Toast). -->
    <link href="CleverPoint.Migrator.Ux.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="app-loading">
            <div class="app-loading-spinner"></div>
            <div class="app-loading-text">Loading CleverPoint Migrator…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Fluent UI web-component initializers (must load BEFORE blazor.webview.js in a WebView). -->
    <script app-name="CleverPoint.Migrator.Ux"
            src="./_content/Microsoft.FluentUI.AspNetCore.Components/js/initializersLoader.webview.js"></script>
    <script src="_framework/blazor.webview.js"></script>
    <!-- Freezes resizable grid columns to pixels on render to kill the first-drag jump. -->
    <script src="cp-grid.js"></script>
    <!-- Footer page-zoom (browser-like +/-/reset). -->
    <script>window.cpSetZoom = function (z) { document.documentElement.style.zoom = z; };</script>
    <script>
        // The browser inside the app offers things typed before in any text box ("Saved info"). In an app
        // that is noise: a site address is no help when looking for a report. Every text box is told not
        // to. The boxes of the Fluent components live in their own shadow trees, so those are walked too,
        // and a box is also caught at the moment it gets the focus, wherever it is.
        (function () {
            function quiet(box) {
                if (box && (box.tagName === 'INPUT' || box.tagName === 'TEXTAREA') && box.getAttribute('autocomplete') !== 'off') {
                    box.setAttribute('autocomplete', 'off');
                    box.setAttribute('aria-autocomplete', 'none');
                }
            }
            function sweep(root) {
                root.querySelectorAll('input, textarea').forEach(quiet);
                root.querySelectorAll('*').forEach(function (el) { if (el.shadowRoot) sweep(el.shadowRoot); });
            }
            var pending = false;
            function later() {
                if (pending) return;
                pending = true;
                setTimeout(function () { pending = false; sweep(document); }, 150);
            }
            document.addEventListener('focusin', function (e) { quiet(e.composedPath ? e.composedPath()[0] : e.target); }, true);
            document.addEventListener('pointerdown', function (e) { quiet(e.composedPath ? e.composedPath()[0] : e.target); }, true);
            new MutationObserver(later).observe(document.documentElement, { childList: true, subtree: true });
            later();
        })();
    </script>
    <script>window.cpCopy = function (text) { return navigator.clipboard.writeText(text); };</script>
    <script>window.cpScrollTo = function (id) { var e = document.getElementById(id); if (e) e.scrollIntoView({ block: 'nearest' }); };</script>
</body>

</html>
